<body>
  <header>
    <div class="capcalera">
      <h1>Rutes de senderisme per Catalunya</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inici</a></li>
        <li><a class="actiu" href="rutes.html">Rutes</a></li>

  <main>
    <h2>Sis rutes per descobrir</h2>
    <p>Clica una de les miniatures i la veuràs en mida gran a sota.</p>

    <div class="galeria-miniatures">
      <figure>
        <img src="img/mini1.png" data-gran="img/gran1.png" alt="Montserrat" onclick="mostrarImatge(this)">
        <figcaption>Montserrat</figcaption>
      </figure>
      <figure>
        <img src="img/mini2.png" data-gran="img/gran2.png" alt="Delta de l'Ebre" onclick="mostrarImatge(this)">
        <figcaption>Delta de l'Ebre</figcaption>
      </figure>
      <figure>
        <img src="img/mini3.png" data-gran="img/gran3.png" alt="Ports de Tortosa-Beseit" onclick="mostrarImatge(this)">
        <figcaption>Ports de Tortosa-Beseit</figcaption>
      </figure>
      <figure>
        <img src="img/mini4.png" data-gran="img/gran4.png" alt="Pirineus" onclick="mostrarImatge(this)">
        <figcaption>Pirineus</figcaption>
      </figure>
      <figure>
        <img src="img/mini5.png" data-gran="img/gran5.png" alt="Costa Brava" onclick="mostrarImatge(this)">
        <figcaption>Costa Brava</figcaption>
      </figure>
      <figure>
        <img src="img/mini6.png" data-gran="img/gran6.png" alt="Cap de Creus" onclick="mostrarImatge(this)">
        <figcaption>Cap de Creus</figcaption>
      </figure>
    </div>

    <figure class="visor">
      <img id="imatge-gran" src="img/gran1.png" alt="Montserrat">
      <figcaption id="peu-imatge">Montserrat</figcaption>
    </figure>

  <footer>
